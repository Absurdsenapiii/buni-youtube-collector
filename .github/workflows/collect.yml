name: BMH public YouTube collection
# Runs daily at 08:17 Asia/Singapore (00:17 UTC), plus manual verification.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
concurrency:
  group: bmh-collector
  cancel-in-progress: false
jobs:
  collect:
    if: vars.COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - run: npm run collect
        env:
          COLLECTOR_ENABLED: ${{ vars.COLLECTOR_ENABLED }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
